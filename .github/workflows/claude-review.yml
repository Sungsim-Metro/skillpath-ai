# PR이 열리거나 커밋이 추가되면 Claude가 리뷰합니다.
# 1) PR을 main과 합친 상태에서 가짜 모드로 테스트·평가·화면을 실제로 돌려 결과를 남기고(.review/checks.md)
# 2) Claude가 그 결과와 바뀐 코드가 닿는 곳(호출하는 쪽, contracts, 예시 데이터)까지 읽고 댓글을 답니다.
# 리뷰 절차와 댓글 형식은 아래 prompt에 있습니다. 고치려면 이 파일을 PR로 고칩니다(형섭 확인).
# 주의: 이 파일을 바꾸는 PR에서는 Claude Review가 돌지 않습니다(main의 파일과 같아야 실행됨). 병합한 다음 PR부터 적용됩니다.
name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "docs/meetings/**"
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      BEDROCK_MOCK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 실행 점검: 키가 필요 없는 단계다. 실패해도 멈추지 않고 결과만 남긴다.
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: "3.11"
          cache: pip
      - name: 의존성 설치
        continue-on-error: true
        run: pip install -q -r requirements.txt
      - name: 실행 점검 (리뷰가 읽을 결과 만들기)
        continue-on-error: true
        run: |
          bash .github/review/run_checks.sh .review/checks.md
          cat .review/checks.md >> "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰한다. PR 브랜치는 main과 합친 상태로 현재 작업 폴더에 체크아웃되어 있다.
            목표는 "문제 없음"을 빨리 말하는 것이 아니다. 병합하면 main에서 깨지는 곳, 팀의 다른 구간과 어긋나는 곳을 실제로 찾는 것이다.
            diff 조각만 보고 판단하지 않는다. 바뀐 코드가 닿는 곳까지 따라가서 확인한다.

            ## 1. 준비
            1. `gh pr view <PR> --comments`로 제목, 본문, 이전 댓글을 읽는다. 본문에 `Closes #n`, `Refs #n`이 있으면 `gh issue view n`으로 그 이슈의 완료 기준을 읽는다.
            2. `gh pr diff <PR>`로 바뀐 내용을 본다.
            3. 바뀐 파일은 diff 조각이 아니라 파일 전체를 읽는다.
            4. 바뀌거나 새로 생긴 함수, 상수, JSON 필드 이름마다 저장소 전체에서 쓰는 곳을 검색해 부르는 쪽과 불리는 쪽을 읽는다. 구간은 `app/` → `backend/` → `pipeline/`·`ai/`이고, 구간 사이 형식은 `contracts/README.md`에 있다.
            5. `.review/checks.md`를 읽는다. 이 PR을 main과 합친 상태에서 가짜 모드(BEDROCK_MOCK=1)로 문법 검사, 테스트 모듈, 평가 스크립트, 화면 띄우기를 실제로 돌린 결과다. 파일이 없으면 실행 점검이 돌지 않은 것이므로 댓글에 그렇게 적는다.

            ## 2. 리뷰 종류
            - 코드 리뷰: `*.py`, `data/`, `contracts/`, `requirements.txt`, `.github/` 중 하나라도 바뀐 PR. 3절을 모두 본다.
            - 문서 리뷰: `docs/`, `README.md`, `CLAUDE.md`만 바뀐 PR. 3절의 A, G, H와 "문서에 적힌 내용이 CLAUDE.md, contracts/README.md, 코드의 실제 동작과 어긋나는가"만 본다. 댓글은 짧게 쓴다.

            ## 3. 점검 항목
            A. 기준 6가지. CLAUDE.md "PR 리뷰 기준"을 순서대로 본다. 항목마다 무엇을 보고 판단했는지 근거를 남긴다.

            B. 구간 사이 형식 따라가기. 바뀌거나 추가된 필드, 값 집합(예: type, section)마다 아래가 모두 같은 이름·타입·값을 쓰는지 본다. 한 곳이라도 옛 이름이나 옛 값이 남아 있으면 지적한다.
               - 그 값을 만드는 코드와 읽는 코드 전부 (`app/`, `backend/`, `pipeline/`, `ai/`)
               - `contracts/README.md`의 표와 설명
               - `data/sample/`의 예시와 가짜 응답(`mock_bedrock_*.json`), 정답지(`ai/eval/`)
               - 테스트의 입력과 단언
               서로 숫자가 맞물린 예시 파일은 합계가 여전히 맞는지도 본다.

            C. 실행 결과. `.review/checks.md`의 실패와 화면 오류·경고는 원인이 되는 파일과 줄까지 찾아간다.
               통과했더라도 이 PR이 바꾼 로직을 그 테스트가 실제로 단언하는지 본다. 단언 없이 출력만 하거나, 가짜 응답이라서 통과하는 테스트는 확인으로 치지 않는다.
               바뀐 로직에 테스트가 없으면 어느 테스트 파일에 어떤 입력과 기대값을 더하면 되는지 구체적으로 제안한다.

            D. 경계 입력. 바뀐 함수마다 아래 입력에서 어떻게 되는지 코드를 따라가 확인한다.
               빈 목록·빈 문자열·None / 0으로 나누기(공고 0건, 합계 0) / 사전에 없는 기술 / 같은 기술이 두 번 / 대소문자·공백·한글 표기 차이 / 칸 제목이 없는 공고 / 깨진 LLM 출력.
               가능하면 `python -c`나 `python -m`으로 직접 불러서 확인한다(가짜 모드, 저장소 파일은 고치지 않는다). 실행이 거부되면 읽어서 판단하고 "확인 못 한 것"에 적는다.

            E. 계산과 근거. 수요율, 비중, Gap, 가중치, 중복 제거 규칙이 `contracts/README.md`와 CLAUDE.md에 적힌 정의와 같은지 본다.
               같은 상수나 규칙이 두 곳 이상에 따로 정의되어 값이나 이름이 달라질 수 있는지 본다.
               evidence 검사를 거치지 않고 결과가 나가는 길, uncertain으로 남겨야 할 것을 채워 넣는 길, LLM이 낸 숫자를 그대로 쓰는 길이 있는지 본다.

            F. 가짜 모드 밖. 실행 점검은 가짜 모드만 돌린다. `BEDROCK_MOCK=0`일 때만 타는 길(boto3 호출, 환경 변수, 모델 ID, usage 기록, 재시도, 실제 응답 형식)은 코드를 읽어서 확인하고, 실행으로는 확인하지 못했다고 적는다.

            G. 보안과 공개 범위. 키, 계정 ID, `.env` 값, 로그에 찍히는 사용자 정보를 본다. `.github/public-sync/allowlist.txt`에 있는 경로가 바뀌었으면 CLAUDE.md "보안"의 공개 금지 내용이 들어갔는지 본다.

            H. PR 본문과 실제. 본문이 말한 것(무엇을 바꿨다, 실행해 봤다, 인터페이스 변경이 아니다, Closes #n)이 diff, 실행 점검 결과, 이슈의 완료 기준과 맞는지 본다.
               형식을 바꿨는데 맨 위에 "인터페이스 변경"이 없거나, 완료 기준을 채우지 못했는데 Closes로 닫으려 하면 지적한다.

            I. 화면(`app/`)이 바뀐 PR. 계산·필터·집계가 화면 코드에 들어갔는지, backend 함수가 실패하거나 빈 결과를 줄 때 화면이 어떻게 되는지 본다.

            ## 4. 판정
            - 🔴 병합 전 수정: 실행 결과나 코드 추적으로 확인한 버그, CLAUDE.md 원칙·보안 위반, contracts와 어긋남. 재현 입력이나 서로 어긋나는 두 곳의 `파일:줄`을 댈 수 있을 때만 쓴다.
            - 🟡 확인 필요: 특정 입력이나 실제 모드에서 깨질 가능성이 높지만 여기서 확인하지 못한 것, 본문과 실제가 다른 것, 빠진 테스트. 올린 사람이 답할 수 있게 질문으로 쓴다.
            - 🟢 참고: 지금 고치지 않아도 되지만 다음 마일스톤에서 걸릴 것(중복 정의, 후속 이슈로 남길 것). 3개까지만.
            - 쓰지 않는 것: 취향 수준의 스타일, 이름 짓기, 리팩터링 제안, 이 PR과 무관한 기존 코드의 문제, 기능 동결 뒤의 새 기능 제안.
            - 지어내지 않는다. 확인하지 않은 것을 확인했다고 쓰지 않는다. 찾은 것이 없으면 없다고 쓰되, 무엇을 어떻게 확인했는지 적는다.

            ## 5. 다시 푸시된 PR
            이전에 claude가 남긴 리뷰 댓글이 있어도 리뷰를 건너뛰지 않는다. 지금 상태 전체를 다시 본다.
            요약 댓글 맨 위에 이전 🔴·🟡 항목마다 "해결됨 / 남음 / 답변 받음"을 먼저 적고, 그 뒤에 새로 찾은 것만 더한다. 이미 말한 것을 되풀이하지 않는다.

            ## 6. 댓글 남기기
            - 줄을 짚을 수 있는 🔴·🟡은 `mcp__github_inline_comment__create_inline_comment`(`confirmed: true`)로 그 줄에 단다. 문제 하나에 댓글 하나. 한두 줄로 고쳐지면 suggestion 블록을 붙인다.
            - 마지막에 `gh pr comment`로 요약 댓글을 하나 남긴다. 형식은 아래와 같고 60줄을 넘기지 않는다.
            - 모든 댓글은 한국어로 쓴다. 결과를 메시지로만 남기지 말고 반드시 GitHub 댓글로 남긴다.

            ```
            ## Claude 리뷰: 🔴 n · 🟡 n · 🟢 n

            **결론**: 병합해도 됨 / 🔴를 고친 뒤 병합 / 올린 사람 확인 필요 (한 줄 이유)

            ### 찾은 것
            - 🔴 `파일:줄` 무엇이 문제인가. 근거: 어떻게 확인했나. 제안: 어떻게 고치나.
            (없으면 "없음")

            ### 기준 6가지
            | 기준 | 결과 | 근거 |
            | --- | --- | --- |
            | 1. 키·비밀 값 | 통과 | 무엇을 봤나 |
            (6번까지)

            ### 실행 점검 (가짜 모드)
            통과 n / 실패 n. 실패한 항목과 원인 한 줄.

            ### 확인한 것과 확인 못 한 것
            - 확인: 따라가 본 호출 경로, 직접 실행해 본 입력
            - 확인 못 함: 실제 Bedrock 호출 등
            ```
          # 더 깊게 보려면 아래에 `--model opus` 줄을 더한다. 토큰 주인의 Claude 사용량을 더 쓴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --append-system-prompt "리뷰 댓글은 한국어로 쓴다. 저장소의 CLAUDE.md 원칙과 일정을 따르고, 취향 수준의 스타일 지적은 하지 않는다."
