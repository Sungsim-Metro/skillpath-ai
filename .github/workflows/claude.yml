# PR이나 이슈 댓글에서 @claude 라고 부르면 Claude가 답합니다.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # 팀원 댓글에만 반응한다. 저장소를 공개해도 외부 댓글로는 실행되지 않는다.
    # 팀원이 바뀌면 아래 목록의 GitHub 아이디를 고친다.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["simhyeongseop","IlhyeonChoo","202202571","baeseongjin123"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --append-system-prompt "답은 한국어로 짧게 쓴다. 저장소의 CLAUDE.md 원칙과 일정을 따른다."
